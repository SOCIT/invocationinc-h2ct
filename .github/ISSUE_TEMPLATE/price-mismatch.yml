name: Price mismatch
description: The price on the page does not match checkout
title: "[price] Page and checkout price mismatch"
labels: ["content"]
body:
  - type: markdown
    attributes:
      value: |
        The live H2CT system is a flat $9.99. There is no strike price, no countdown, and no price ladder. Checkout must charge that same amount.
  - type: input
    id: seen_price
    attributes:
      label: Price they saw
    validations:
      required: true
  - type: input
    id: checkout_price
    attributes:
      label: Price at checkout (if different)
  - type: textarea
    id: when
    attributes:
      label: When / timezone / screenshot notes
    validations:
      required: true
