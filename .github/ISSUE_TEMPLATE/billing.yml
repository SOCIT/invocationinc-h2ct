name: Billing / refund / receipt
description: Charge, refund, or receipt — invocationinc.com/billing first
title: "[billing] Charge / refund / receipt"
labels: ["billing"]
body:
  - type: markdown
    attributes:
      value: |
        Send them to https://invocationinc.com/billing first. Escalate to Owner Desk only if that cannot resolve it.
  - type: dropdown
    id: portal_tried
    attributes:
      label: Did they try invocationinc.com/billing?
      options:
        - Yes — still blocked
        - No — need billing link
        - Unsure
    validations:
      required: true
  - type: input
    id: email
    attributes:
      label: Buyer email
    validations:
      required: true
  - type: dropdown
    id: ask
    attributes:
      label: Ask
      options:
        - Refund
        - Receipt / invoice
        - Update card
        - Duplicate charge
        - Other
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
    validations:
      required: true
